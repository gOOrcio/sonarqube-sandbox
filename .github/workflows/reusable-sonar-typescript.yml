name: SonarQube Analysis — TypeScript

on:
  workflow_call:
    inputs:
      project_key:
        description: 'SonarQube project key'
        required: true
        type: string
      working_directory:
        description: 'Directory containing package.json and sonar-project.properties'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: ${{ inputs.working_directory }}
        run: pnpm exec jest --coverage --coverageReporters=lcov --passWithNoTests

      - uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project_key }}
            -Dsonar.host.url=https://sonarqube.mati-lab.online
            ${{ github.event_name == 'pull_request' &&
              format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                github.event.pull_request.number, github.head_ref, github.base_ref) ||
              format('-Dsonar.branch.name={0}', github.ref_name) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
