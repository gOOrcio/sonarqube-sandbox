name: SonarQube Analysis — Python

on:
  workflow_call:
    inputs:
      project_key:
        description: 'SonarQube project key'
        required: true
        type: string
      working_directory:
        description: 'Directory containing sonar-project.properties'
        required: false
        type: string
        default: '.'
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run tests with coverage
        working-directory: ${{ inputs.working_directory }}
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project_key }}
            -Dsonar.host.url=https://sonarqube.mati-lab.online
            ${{ github.event_name == 'pull_request' &&
              format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                github.event.pull_request.number, github.head_ref, github.base_ref) ||
              format('-Dsonar.branch.name={0}', github.ref_name) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
