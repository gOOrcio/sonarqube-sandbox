name: SonarQube Analysis — Java

on:
  workflow_call:
    inputs:
      project_key:
        description: 'SonarQube project key'
        required: true
        type: string
      working_directory:
        description: 'Directory containing gradlew (relative to repo root)'
        required: false
        type: string
        default: '.'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required for branch/PR analysis

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and generate coverage
        working-directory: ${{ inputs.working_directory }}
        run: ./gradlew test jacocoTestReport

      - name: SonarQube scan
        working-directory: ${{ inputs.working_directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ inputs.project_key }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SONAR_ARGS=("-Dsonar.projectKey=$PROJECT_KEY")
          SONAR_ARGS+=("-Dsonar.host.url=https://sonarqube.mati-lab.online")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            SONAR_ARGS+=("-Dsonar.pullrequest.key=$PR_NUMBER")
            SONAR_ARGS+=("-Dsonar.pullrequest.branch=$HEAD_REF")
            SONAR_ARGS+=("-Dsonar.pullrequest.base=$BASE_REF")
          else
            SONAR_ARGS+=("-Dsonar.branch.name=$REF_NAME")
          fi

          ./gradlew sonar "${SONAR_ARGS[@]}"
