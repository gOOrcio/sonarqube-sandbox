name: SonarQube Analysis — Java

on:
  workflow_call:
    inputs:
      project_key:
        description: 'SonarQube project key'
        required: true
        type: string
      working_directory:
        description: 'Directory containing gradlew (relative to repo root)'
        required: false
        type: string
        default: '.'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for branch/PR analysis

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and generate coverage
        working-directory: ${{ inputs.working_directory }}
        run: ./gradlew test jacocoTestReport

      - name: SonarQube scan
        working-directory: ${{ inputs.working_directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ inputs.project_key }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SONAR_ARGS=("-Dsonar.projectKey=$PROJECT_KEY")
          SONAR_ARGS+=("-Dsonar.host.url=https://sonarqube.mati-lab.online")

          # CE workaround: always scan as a named branch so results appear in the
          # SonarQube dashboard. PR decoration comment is sacrificed in favour of
          # dashboard visibility. The GitHub Actions check still shows pass/fail.
          BRANCH="${HEAD_REF:-$REF_NAME}"
          SONAR_ARGS+=("-Dsonar.branch.name=$BRANCH")

          ./gradlew sonar "${SONAR_ARGS[@]}"
